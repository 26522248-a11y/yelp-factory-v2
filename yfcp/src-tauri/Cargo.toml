[package]
name = "yfcp"
version = "0.1.0"
description = "Yelp Factory Control Panel"
authors = ["YFCP"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yfcp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Relays console → engine admin API calls (the engine sends no CORS headers).
# No TLS is needed: the admin API is bound to 127.0.0.1 and plain HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Admin token lives in Windows Credential Manager, not in the JSON store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[profile.release]
# Kept buildable on low-memory operator boxes: LTO + single codegen unit peaks
# above 2 GB per rustc process, which OOMs a 4 GB VM.
codegen-units = 8
lto = false
opt-level = "s"
debug = false
panic = "abort"
strip = true

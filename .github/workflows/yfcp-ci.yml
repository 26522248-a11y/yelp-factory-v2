name: yfcp-ci

on:
  push:
    paths:
      - "yfcp/**"
      - ".github/workflows/yfcp-ci.yml"
  pull_request:
    paths:
      - "yfcp/**"
      - ".github/workflows/yfcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-contract:
    name: Engine accounts contract (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Pure projection tests: no Postgres service required.
      - run: python -m pytest tests/unit/test_accounts_api.py tests/unit/test_nodes_api.py -q

  frontend:
    name: Frontend (tsc + vite + oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yfcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yfcp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build

  rust:
    name: Tauri shell (fmt + clippy + tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yfcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yfcp/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yfcp/package-lock.json
      # `tauri::generate_context!` embeds ../dist, so build it before cargo.
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  installer:
    name: NSIS installer (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [engine-contract, frontend, rust]
    defaults:
      run:
        working-directory: yfcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yfcp/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yfcp/package-lock.json
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: yfcp-nsis
          path: yfcp/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

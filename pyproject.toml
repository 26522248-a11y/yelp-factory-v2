[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yelp-factory"
version = "0.1.0"
description = "Yelp account factory: automated signup and account warming through GPM Login profiles"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.47",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "tenacity>=8.5",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "psutil>=6.0",
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "PyYAML>=6.0.1",
  "pillow>=10.0",
  "cryptography>=42.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
]

[project.scripts]
yf = "cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
  "core", "adapters", "flows", "selector_registry", "human", "obs", "api", "db",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "E-*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/core", "src/flows"]
